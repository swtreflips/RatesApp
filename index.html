<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- ACTIVE SKIN. Every design token the app uses is defined here; tailwind.config.js only
         maps utilities onto these variables. Swap the href to re-skin the entire application
         without rebuilding or touching a component. Variants live in public/skins/. -->
    <link id="skin" rel="stylesheet" href="/skins/maritime.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1726" />
    <title>RatesApp — Ocean Rate Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- CANDIDATE FONTS — exploration only, TRIM TO THE WINNER'S THREE FAMILIES.
         A skin can name any family, but naming one the browser never downloaded just falls back
         to a system font, so every variant would silently look identically typeset and the
         comparison would be about colour alone. This link exists so the type differences are
         real; leaving it in production would cost a needless download for families nobody uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:wght@400;500;600;700&family=Public+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-fog-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
